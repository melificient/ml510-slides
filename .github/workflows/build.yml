name: Build slides

on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'vendor/**', 'build.py', 'export_pdf.py', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build index.html
        run: python build.py
      - name: Still frame of the demo video
        run: |
          if [ -f assets/demo.mp4 ]; then
            command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
            ffmpeg -loglevel error -y -ss 20 -i assets/demo.mp4 -frames:v 1 -q:v 3 assets/demo-poster.jpg
          fi
      - name: Export slides.pdf
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          python export_pdf.py
      - name: Keep index.html in the repo up to date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Rebuild index.html" && git push)
      - name: Prepare site
        run: |
          mkdir -p _site/assets
          cp index.html slides.pdf _site/
          if [ -f assets/demo.mp4 ]; then cp assets/demo.mp4 _site/assets/; fi
          if [ -f assets/demo-poster.jpg ]; then cp assets/demo-poster.jpg _site/assets/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: slides.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
