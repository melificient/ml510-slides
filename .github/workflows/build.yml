name: Build slides

on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'vendor/**', 'build.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build index.html
        run: python build.py
      - name: Commit index.html if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Rebuild index.html" && git push)
